[project]
name = "gtfs-zone-feed-fetch"
version = "0.1.0"
requires-python = ">=3.13"
description = "Shared GTFS fetch, schedule store contract and zip facts for the gtfs.zone pipelines"
license = "AGPL-3.0-or-later"
dependencies = [
    "babel>=2.16",
    "httpx>=0.27",
    "reverse-geocode>=1.6.6",
]

[dependency-groups]
dev = [
    "commitizen",
    "deptry>=0.25.1",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_zone_feed_fetch"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.vulture]
paths = ["src"]
# The library's API is used by the pipelines that import it, not by itself.
min_confidence = 100

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
bump_message = "chore(release): bump version $current_version -> $new_version"
annotated_tag = true
pre_bump_hooks = [
    "bash -c 'branch=$(git branch --show-current); [ \"$branch\" = \"main\" ] || { echo \"Error: cz bump must be run on main (currently on \\\"$branch\\\")\"; exit 1; }'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
